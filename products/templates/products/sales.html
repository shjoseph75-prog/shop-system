<!DOCTYPE html>
<html>
<head>
    <title>Sales History</title>
</head>
<body>

    <h1>Sales History</h1>
    <h2>Total Revenue: {{ total_revenue }} TZS</h2>

    <a href="/">Back</a>

    {% for sale in sales %}
        <p>
            {{ sale.product.name }} |
            Qty: {{ sale.quantity_sold }} TZS |
            Total: {{ sale.total_price }} TZS |
            Date: {{ sale.date }}
        </p>
    {% endfor %}    
</body>    
</html>
